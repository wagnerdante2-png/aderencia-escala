name: RC50 End-to-End

on:
  workflow_dispatch:
  push:
    paths:
      - "*.js"
      - "*.html"
      - "*.css"
      - "package.json"
      - "package-lock.json"
      - "tests/e2e/**"
      - "tests/fixtures/**"
      - ".github/workflows/e2e-rc50.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      HOME_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright --version
      - run: npx playwright install --with-deps chromium
      - name: Validar sintaxe do health check RC58
        run: node --check rc50-integrity-check.js
      - run: npm run test:e2e:chromium
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-rc50
          path: playwright-report/
