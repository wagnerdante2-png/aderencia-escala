name: RC56 One-off Syntax Patch

on:
  push:
    branches:
      - fix-partial-cycle-rc55-20260831
    paths:
      - .github/workflows/rc56-oneoff-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-partial-cycle-rc55-20260831
          fetch-depth: 0
      - name: Patch engine-v4 syntax
        shell: python
        run: |
          from pathlib import Path
          p = Path('engine-v4.js')
          text = p.read_text(encoding='utf-8')
          old = "+(sameEnds?.04:0)"
          new = "+(sameEnds ? .04 : 0)"
          if old not in text:
              print('Patch already applied or target not found.')
          else:
              p.write_text(text.replace(old, new), encoding='utf-8')
              print('Patched engine-v4.js')
      - name: Commit patch
        run: |
          if git diff --quiet -- engine-v4.js; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine-v4.js
          git commit -m "fix: corrigir sintaxe do motor resiliente RC56"
          git push origin HEAD:fix-partial-cycle-rc55-20260831
